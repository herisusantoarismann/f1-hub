<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <linearGradient id="outlineGrad_default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#FF3333" />
    </linearGradient>
    <filter id="outlineGlow_default" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Track Ribbon -->
  <path d="M 75,410 L 75,130 Q 75,100 105,100 L 190,100 Q 215,100 225,120 L 240,150 Q 250,175 275,175 L 340,175 Q 365,175 375,150 L 390,120 Q 405,95 430,105 L 445,120 Q 455,140 440,175 L 400,245 Q 385,270 355,270 L 290,270 Q 270,270 260,290 L 245,320 Q 235,345 260,360 L 350,360 Q 380,360 395,385 L 400,410 Q 395,435 365,435 L 130,435 Q 100,435 90,415 L 75,410 Z" 
        stroke="url(#outlineGrad_default)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#outlineGlow_default)" />

  <!-- High-Precision Centerline -->
  <path d="M 75,410 L 75,130 Q 75,100 105,100 L 190,100 Q 215,100 225,120 L 240,150 Q 250,175 275,175 L 340,175 Q 365,175 375,150 L 390,120 Q 405,95 430,105 L 445,120 Q 455,140 440,175 L 400,245 Q 385,270 355,270 L 290,270 Q 270,270 260,290 L 245,320 Q 235,345 260,360 L 350,360 Q 380,360 395,385 L 400,410 Q 395,435 365,435 L 130,435 Q 100,435 90,415 L 75,410 Z" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        stroke-opacity="0.95" />

  <!-- Start/Finish Marker and Direction -->
  <path d="M 85,300 L 65,300" fill="#FFFFFF" fill-opacity="1" />
  <path d="M 75,280 L 75,290" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
