<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="helmetBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2a32" />
      <stop offset="100%" stop-color="#121216" />
    </radialGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e10600" />
      <stop offset="40%" stop-color="#ff4638" />
      <stop offset="70%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#e10600" />
    </linearGradient>
    <linearGradient id="shieldReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4" />
      <stop offset="100%" stop-color="white" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="baseCarbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#383842" />
      <stop offset="100%" stop-color="#1f1f26" />
    </linearGradient>
  </defs>

  <!-- Circular Avatar Background Frame -->
  <circle cx="100" cy="100" r="96" fill="url(#helmetBg)" stroke="#3a3a48" stroke-width="3" />

  <!-- Shoulder / Hans Device Silhouette -->
  <path d="M42 178 C52 145, 80 140, 100 140 C120 140, 148 145, 158 178 C142 188, 122 194, 100 194 C78 194, 58 188, 42 178 Z" fill="url(#baseCarbon)" />
  <path d="M70 148 L100 156 L130 148 L126 182 L74 182 Z" fill="#141418" opacity="0.6" />

  <!-- Helmet Outer Shell (Side/3/4 Perspective) -->
  <path d="M100 32 C60 32, 48 62, 48 94 C48 126, 64 145, 96 146 C124 147, 154 136, 154 94 C154 58, 134 32, 100 32 Z" fill="url(#baseCarbon)" stroke="#4a4a58" stroke-width="2" />

  <!-- Rear Aerodynamic Spoiler & Crown Curve -->
  <path d="M52 82 C50 68, 62 44, 90 36 C76 44, 68 58, 64 78 Z" fill="#5a5a68" opacity="0.5" />
  <path d="M138 96 C144 98, 156 102, 158 112 C154 115, 144 116, 136 114 Z" fill="#e10600" opacity="0.8" />

  <!-- Visor Assembly -->
  <!-- Visor Dark Recess -->
  <path d="M84 72 C116 70, 144 76, 150 90 C154 98, 148 110, 134 112 C104 116, 82 108, 76 96 C72 88, 76 76, 84 72 Z" fill="#0a0a0e" />

  <!-- Iridescent Chrome/Ruby Visor Glass -->
  <path d="M86 75 C114 73, 140 78, 146 90 C149 96, 144 106, 132 108 C105 112, 85 105, 80 95 C77 88, 80 78, 86 75 Z" fill="url(#visorGrad)" />

  <!-- Visor Glare / Reflection Streak -->
  <path d="M92 78 C115 76, 132 80, 138 88 C130 87, 105 84, 90 87 Z" fill="url(#shieldReflection)" />

  <!-- Chin Vent & Air Intakes -->
  <path d="M108 126 C120 125, 132 122, 136 118 L138 126 C130 132, 116 134, 106 132 Z" fill="#18181f" />
  <line x1="112" y1="128" x2="130" y2="125" stroke="#e10600" stroke-width="1.5" stroke-linecap="round" />
  <line x1="115" y1="131" x2="128" y2="129" stroke="#71717a" stroke-width="1" stroke-linecap="round" />

  <!-- Visor Pivot Screw / Tear-off Post -->
  <circle cx="76" cy="94" r="5" fill="#2a2a36" stroke="#5a5a68" stroke-width="1.5" />
  <circle cx="76" cy="94" r="2" fill="#e10600" />
</svg>
